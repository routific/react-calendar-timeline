# Publishes when a `vX.Y.Z` tag is pushed (from version-bump.yml) or via manual dispatch.
#
# Auth: npm Trusted Publisher (OIDC) — same model as hive.
# Do NOT pass NODE_AUTH_TOKEN / registry-url auth lines; they override OIDC and
# cause EOTP / ENEEDAUTH. Configure Trusted Publisher on the package for:
#   repo: routific/react-calendar-timeline
#   workflow: npm-publish.yml
name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # Node 24 ships an npm new enough for Trusted Publisher OIDC.
      # Do not set registry-url here — setup-node would write an empty
      # _authToken line that prevents OIDC from running.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Ensure npm supports Trusted Publisher
        run: |
          npm install -g npm@11.6.2
          npm --version

      - run: npm ci
      - run: npm run build:lib

      # No NODE_AUTH_TOKEN — OIDC only.
      - name: Publish
        run: npm publish --access restricted

      - name: Build Slack payload
        env:
          TAG_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          jq -n \
            --arg id "@routific/react-calendar-timeline@${version}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/releases/tag/${tag}" \
            '{text: (":package: Timeline published `" + $id + "` to npm (<" + $url + "|view tag>)")}' \
            > slack-payload.json

      - name: Notify Slack
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json
